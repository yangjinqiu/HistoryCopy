name: HistoryCopy
options:
  bundleIdPrefix: com.historycopy
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "15.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""

targets:
  HistoryCopy:
    type: application
    platform: macOS
    sources:
      - path: HistoryCopy
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: "HistoryCopy"
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.utilities"
        INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright © 2026. All rights reserved."
        INFOPLIST_KEY_LSUIElement: "YES"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_KEY_NSSupportsAutomaticTermination: "YES"
        INFOPLIST_KEY_NSHighResolutionCapable: "YES"
    entitlements:
      path: HistoryCopy/HistoryCopy.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.files.user-selected.read-only: false
